<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF2F0" />
    <script>
      /* Thème avant le premier affichage : clair par défaut (nouveaux utilisateurs), sombre seulement si l'étudiant l'a choisi. */
      (function () {
        var t = 'light'
        try { if (localStorage.getItem('memoa-pref-theme') === 'dark') t = 'dark' } catch (e) {}
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <title>Memoa — Étudiez plus intelligemment</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
