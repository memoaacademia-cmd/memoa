# Le webhook de paiement est appelé par Chariow (pas par un étudiant connecté) :
# il est protégé par la signature HMAC (x-chariow-signature) vérifiée dans le code, pas par un jeton utilisateur.
[functions.payments-webhook]
verify_jwt = false

# La notification quotidienne est lancée par la planification de Supabase (pas par un étudiant) :
# elle est protégée par le secret CRON_SECRET vérifié dans le code.
[functions.daily-fact-push]
verify_jwt = false

# Le rappel des brouillons est lancé par la planification de Supabase (CRON_SECRET vérifié dans le code).
[functions.draft-reminder-push]
verify_jwt = false

# Le rappel d'expiration d'abonnement est lancé par la planification de Supabase (CRON_SECRET vérifié dans le code).
[functions.subscription-expiry-push]
verify_jwt = false

# Le rattrapage des paiements est lancé par la planification de Supabase (CRON_SECRET vérifié dans le code).
[functions.payments-reconcile]
verify_jwt = false

# Le rappel des cartes de révision est lancé par la planification de Supabase (CRON_SECRET vérifié dans le code).
[functions.cards-reminder-push]
verify_jwt = false
